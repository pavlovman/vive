<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤 추천 - 음식 추천</title>
  <meta name="description" content="점심 음식 랜덤 추천" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=SUIT:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="top-nav" aria-label="추천 페이지 이동">
    <a class="nav-link" href="/animal-face.html">동물상 분석</a>
    <a class="nav-link" href="/">로또 번호</a>
    <a class="nav-link" href="/activity.html">오늘 할 일</a>
    <a class="nav-link" href="/study.html">공부 주제</a>
    <a class="nav-link active" href="/lunch.html">음식 추천</a>
  </nav>

  <div class="action-fabs">
    <a class="top-fab comments-fab" href="/comments.html">댓글</a>
    <a class="top-fab partner-fab" href="/partner.html">제휴문의</a>
  </div>

  <main class="app">
    <header class="hero">
      <p class="badge">RANDOM PICKER</p>
      <h1>음식 추천</h1>
      <p class="subtitle">카테고리를 고른 뒤 버튼을 눌러 메뉴를 추천받으세요.</p>
    </header>

    <section class="card" aria-live="polite">
      <p class="label">오늘의 추천 메뉴</p>
      <div class="filters" role="group" aria-label="메뉴 카테고리 필터">
        <button class="food-filter active" type="button" data-category="all">전체</button>
        <button class="food-filter" type="button" data-category="korean">한식</button>
        <button class="food-filter" type="button" data-category="chinese">중식</button>
        <button class="food-filter" type="button" data-category="japanese">일식</button>
        <button class="food-filter" type="button" data-category="western">양식</button>
      </div>
      <h2 id="food-name">버튼을 눌러 메뉴를 추천받으세요</h2>
      <p id="food-reason">오늘 기분에 맞는 메뉴를 골라드립니다.</p>
      <button id="food-button" type="button">메뉴 추천 받기</button>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
