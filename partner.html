  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=SUIT:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="top-nav" aria-label="추천 페이지 이동">
    <a class="nav-link" href="/animal-face.html">동물상 분석</a>
    <a class="nav-link" href="/">로또 번호</a>
    <a class="nav-link" href="/activity.html">오늘 할 일</a>
    <a class="nav-link" href="/study.html">공부 주제</a>
    <a class="nav-link" href="/lunch.html">음식 추천</a>
  </nav>

  <a class="top-fab partner-fab" href="/">메인으로</a>

  <main class="app">
    <header class="hero">
      <p class="badge">PARTNERSHIP</p>
      <h1>제휴 문의</h1>
      <p class="subtitle">협업 제안을 남겨주시면 빠르게 확인 후 연락드리겠습니다.</p>
    </header>

    <section class="card contact-card" aria-labelledby="partner-title">
      <p class="label">제휴 문의</p>
      <h2 id="partner-title" class="contact-title">협업 제안을 보내주세요</h2>
      <form id="partner-form" action="https://formspree.io/f/mgolnppj" method="POST">
        <div class="form-grid">
          <label>
            이름
            <input type="text" name="name" required />
          </label>
          <label>
            이메일
            <input type="email" name="email" required />
          </label>
          <label>
            회사명
            <input type="text" name="company" required />
          </label>
          <label>
            연락처
            <input type="text" name="phone" />
          </label>
        </div>
        <label>
          문의 내용
          <textarea name="message" rows="5" required></textarea>
        </label>
        <input type="hidden" name="_subject" value="[랜덤 추천 사이트] 제휴 문의" />
        <button id="partner-submit" type="submit">제휴문의 보내기</button>
        <p id="partner-status" class="partner-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 랜덤 추천 사이트 | 마지막 업데이트: 2026-02-23</p>
    <nav class="footer-links" aria-label="정책 페이지">
      <a href="/about.html">사이트 소개</a>
      <a href="/privacy.html">개인정보처리방침</a>
      <a href="/terms.html">이용약관</a>
      <a href="/">홈으로</a>
    </nav>
  </footer>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
