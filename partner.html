        <div class="form-grid">
          <label>
            이름
            <input type="text" name="name" required />
          </label>
          <label>
            이메일
            <input type="email" name="email" required />
          </label>
          <label>
            회사명
            <input type="text" name="company" required />
          </label>
          <label>
            연락처
            <input type="text" name="phone" />
          </label>
        </div>
        <label>
          문의 내용
          <textarea name="message" rows="5" required></textarea>
        </label>
        <input type="hidden" name="_subject" value="[랜덤 추천 사이트] 제휴 문의" />
        <button id="partner-submit" type="submit">제휴문의 보내기</button>
        <p id="partner-status" class="partner-status" aria-live="polite"></p>
      </form>
    </section>
