<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 점심 뭐 먹지?</title>
  <meta name="description" content="랜덤 점심 메뉴 추천 웹앱" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=SUIT:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="/style.css" rel="stylesheet" />
</head>
<body>
  <a class="partner-fab" href="/partner.html">제휴문의</a>
  <main class="app">
    <header class="hero">
      <p class="badge">LUNCH PICKER</p>
      <h1>오늘 점심,<br />랜덤으로 정하자</h1>
      <p class="subtitle">버튼 한 번이면 메뉴와 추천 이유를 바로 보여줘요.</p>
    </header>

    <section class="card" aria-live="polite">
      <p class="label">오늘의 추천</p>
      <div class="filters" role="group" aria-label="메뉴 카테고리 필터">
        <button class="filter-button active" type="button" data-category="all">전체</button>
        <button class="filter-button" type="button" data-category="korean">한식</button>
        <button class="filter-button" type="button" data-category="chinese">중식</button>
        <button class="filter-button" type="button" data-category="japanese">일식</button>
        <button class="filter-button" type="button" data-category="western">양식</button>
      </div>
      <h2 id="menu-name">버튼을 눌러 메뉴를 뽑아보세요</h2>
      <p id="menu-reason">든든하고 맛있는 점심을 골라드립니다.</p>
      <button id="pick-button" type="button">랜덤 추천 받기</button>
    </section>

    <p class="footnote">팁: 마음에 안 들면 한 번 더 눌러서 다시 뽑으세요.</p>
  </main>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
